<script>
// Dot-matrix art: the same dots as the site's button icons, blown up into a field of glyphs.
const G={arrow:['..#..','...#.','#####','...#.','..#..'],star:['..#..','#.#.#','.###.','#.#.#','..#..'],grid:['#.#.#','.#.#.','#.#.#','.#.#.','#.#.#'],check:['.....','....#','...#.','#.#..','.#...'],quote:['##.##','##.##','.#..#','#..#.','.....']};
const c=document.getElementById('c'),x=c.getContext('2d');x.scale(2,2);
const S=18; const cols=Math.ceil(1200/S),rows=Math.ceil(630/S);
const lit=new Map();
function stamp(name,cx,cy,scale,col){const m=G[name];m.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch==='#')for(let a=0;a<scale;a++)for(let b=0;b<scale;b++)lit.set((cx+i*scale+a)+','+(cy+j*scale+b),col)}))}
stamp('arrow',30,5,3,'#ffffff');stamp('star',43,1,2,'#dbf130');stamp('grid',29,22,2,'#6f6f6f');stamp('check',40,24,2,'#ffffff');stamp('quote',43,13,1,'#7b5cff');stamp('star',62,28,1,'#ffffff');stamp('grid',56,9,1,'#dbf130');
for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){const k=i+','+j;const px=i*S+S/2,py=j*S+S/2;
 const col=lit.get(k); x.beginPath();x.arc(px,py,col?3.4:2.4,0,Math.PI*2);
 if(col){x.globalAlpha=.2;x.fillStyle=col;x.shadowColor=col;x.shadowBlur=4}else{x.globalAlpha=1;x.fillStyle='rgba(255,255,255,.025)';x.shadowBlur=0} x.fill();}
