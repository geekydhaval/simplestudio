<script>
// The Simple line field: chaos at the edges, aligned toward the centre.
const c=document.getElementById('c'),x=c.getContext('2d');x.scale(2,2);
const cx=600,cy=300,sp=26,len=12,T=-Math.PI/4;
function rnd(i,j){const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s)}
for(let i=0;i<=1200/sp+1;i++)for(let j=0;j<=630/sp+1;j++){
 const px=i*sp,py=j*sp,d=Math.hypot((px-cx)/1.6,py-cy),k=Math.min(1,Math.max(0,(d-90)/260));
 const a=T+(rnd(i,j)-.5)*Math.PI*1.6*k; const near=1-k;
 x.strokeStyle=near>.55?`rgba(219,241,48,${.18+near*.42})`:`rgba(242,242,238,${.05+near*.2})`;
 x.lineWidth=1.6;x.lineCap='round';x.beginPath();
 x.moveTo(px-Math.cos(a)*len/2,py-Math.sin(a)*len/2);x.lineTo(px+Math.cos(a)*len/2,py+Math.sin(a)*len/2);x.stroke();}
</script>
